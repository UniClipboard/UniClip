# Android: relay settings are a bottom sheet under Space settings of a direct-sync space.
appId: ${APP_ID}
---
- clearState
- runFlow: ../lifecycle/launch.yaml
- runFlow: ../actions/onboarding/complete.yaml
- runFlow: ../actions/relay/create-space.yaml
- scrollUntilVisible:
    element:
      id: space-settings
    direction: DOWN
- tapOn:
    id: space-settings
- tapOn:
    id: relay-settings
- extendedWaitUntil:
    visible: "Built-in relays"
    timeout: 30000
- runFlow:
    when:
      visible: "Could not load built-in relays"
    commands:
      - tapOn: "Could not load built-in relays"
- scrollUntilVisible:
    element: "Asia Pacific"
    direction: DOWN
- assertVisible: "North America East"
- assertVisible: "North America West"
- assertVisible: "Europe"
- assertVisible: ".*Configured on the running node.*"
- assertNotVisible: ".*[Cc]onnected.*"
# The editor is its own page: back from it returns to the relay list, not further.
- tapOn:
    id: relay-add
- extendedWaitUntil:
    visible:
      id: relay-save
    timeout: 10000
- back
- extendedWaitUntil:
    visible: "Built-in relays"
    timeout: 10000
# A custom relay replaces the built-in list; built-in rows stay listed but unused.
- tapOn:
    id: relay-add
- tapOn:
    id: relay-url-input
- inputText: "https://relay.uni.z2blog.com"
- hideKeyboard
- tapOn:
    id: relay-save
- extendedWaitUntil:
    visible: "https://relay.uni.z2blog.com/"
    timeout: 60000
- scrollUntilVisible:
    element: ".*Not used while custom relays are set.*"
    direction: DOWN
- assertVisible: "Using your custom relays"
# Removing the custom relay returns routing to the built-in list.
- scrollUntilVisible:
    element: "https://relay.uni.z2blog.com/"
    direction: UP
- tapOn: "https://relay.uni.z2blog.com/"
- tapOn: "Remove relay"
- extendedWaitUntil:
    visible: "Add relay node"
    timeout: 60000
- assertNotVisible: "https://relay.uni.z2blog.com/"
- scrollUntilVisible:
    element: ".*Configured on the running node.*"
    direction: DOWN
- assertVisible: "Using built-in relays"
- assertNotVisible: ".*[Cc]onnected.*"
# Back from the Relay page returns to Space settings, one level up (not to Devices).
- back
- extendedWaitUntil:
    visible: "Network"
    timeout: 10000
- assertVisible: "Space actions"
