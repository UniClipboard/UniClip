# iOS only: relay settings live under Space settings of a direct-sync space.
appId: ${APP_ID}
---
- runFlow: ../lifecycle/launch.yaml
- runFlow: ../assertions/onboarding-visible.yaml
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-skip
- runFlow: ../assertions/home-ready.yaml
- runFlow: ../actions/relay/open-space-settings-ios.yaml
# Empty custom list: the built-in relays are the saved and applied routing.
- runFlow: ../actions/relay/assert-built-in-visible.yaml
- assertVisible: "Using built-in relays"
- assertVisible: ".*Configured on the running node.*"
# The editor is its own page: back from it returns to the relay list, not further.
- tapOn: "Add relay node"
- extendedWaitUntil:
    visible: "Save relay"
    timeout: 10000
- swipe:
    start: "1%,50%"
    end: "70%,50%"
- extendedWaitUntil:
    visible: "Built-in relays"
    timeout: 10000
- assertVisible: "Add relay node"
# A custom relay replaces the built-in list; built-in rows stay listed but unused.
- tapOn: "Add relay node"
- tapOn:
    id: relay-url-input
- inputText: "https://relay.uni.z2blog.com"
- pressKey: ENTER
- tapOn: "Save relay"
- extendedWaitUntil:
    visible: "https://relay.uni.z2blog.com/"
    timeout: 60000
- runFlow: ../actions/relay/assert-built-in-visible.yaml
- assertVisible: "Using your custom relays"
- assertVisible: ".*Not used while custom relays are set.*"
# Removing the custom relay returns routing to the built-in list.
- tapOn: "https://relay.uni.z2blog.com/"
- tapOn: "Remove relay"
- extendedWaitUntil:
    visible: "Add relay node"
    timeout: 60000
- assertNotVisible: "https://relay.uni.z2blog.com/"
- assertVisible: "Using built-in relays"
- assertVisible: ".*Configured on the running node.*"
# The listing never claims a connection or reachability.
- assertNotVisible: ".*[Cc]onnected.*"
# Back from the relay list returns to Space settings, one level up.
- swipe:
    start: "1%,50%"
    end: "70%,50%"
- extendedWaitUntil:
    visible: "Space actions"
    timeout: 10000
