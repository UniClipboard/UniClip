appId: ${APP_ID}
---
- runFlow: submit-invitation.yaml
- extendedWaitUntil:
    visible: "This space is ready to sync clipboard content.|These devices can now sync.|The other device did not accept this invitation|The connection timed out.*|The space password is incorrect.*"
    timeout: 90000
- assertVisible: "This space is ready to sync clipboard content.|These devices can now sync."
- tapOn: "Done"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Clipboard"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: main-tab-Clipboard
