appId: ${APP_ID}
---
# Pre: home ready on iOS. Post: Relay page (Space settings > Network > Relay) of a new direct-sync space.
- tapOn: "Devices"
- tapOn: "Direct (Experimental)"
- runFlow:
    when:
      visible: "Use direct device sync?"
    commands:
      - tapOn: "Use direct sync"
- extendedWaitUntil:
    visible: "Create a new space"
    timeout: 30000
- tapOn: "Create a new space"
- tapOn: "Space password"
- inputText: RelayE2E-passphrase
- tapOn: "Create"
# The system password prompt does not always appear; dismiss it only when it does.
- extendedWaitUntil:
    visible: "Save Password?"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: space-finish-later
    timeout: 30000
- tapOn:
    id: space-finish-later
- extendedWaitUntil:
    visible: "Space settings"
    timeout: 30000
- tapOn: "Space settings"
- extendedWaitUntil:
    visible: "Space actions"
    timeout: 30000
- tapOn: "Relay.*"
- extendedWaitUntil:
    visible: "Built-in relays"
    timeout: 30000
