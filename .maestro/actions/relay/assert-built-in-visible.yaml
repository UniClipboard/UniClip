appId: ${APP_ID}
---
# The overview lists Engine's built-in relays; it never claims a connection.
# The first read can race Engine startup, so retry once when it reports a failure.
- runFlow:
    when:
      visible: "Could not load built-in relays. Tap to retry."
    commands:
      - tapOn: "Could not load built-in relays. Tap to retry."
- extendedWaitUntil:
    visible: "North America East"
    timeout: 30000
- assertVisible: "North America West"
- assertVisible: "Europe"
- assertVisible: "Asia Pacific"
- assertNotVisible: ".*[Cc]onnected.*"
