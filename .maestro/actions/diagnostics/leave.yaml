appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: diagnostics-back
      - assertVisible:
          id: settings-diagnostics
      - swipe:
          start: "50%,10%"
          end: "50%,95%"
          duration: 700
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - back
- runFlow: ../../assertions/home-ready.yaml
