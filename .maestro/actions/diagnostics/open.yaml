appId: ${APP_ID}
---
- runFlow: ../settings/open.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: settings-diagnostics
          direction: DOWN
      - tapOn:
          id: settings-diagnostics
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: settings-developer
          direction: DOWN
      - tapOn:
          id: settings-developer
- scrollUntilVisible:
    element:
      id: engine-diagnostic-capture
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: engine-diagnostic-capture
      enabled: true
    timeout: 30000
- extendedWaitUntil:
    notVisible: ".*Unavailable until the service is ready.*"
    timeout: 30000
