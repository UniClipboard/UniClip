# Pre: home ready. Post: settings storage row visible. Does not change settings.
appId: ${APP_ID}
---
- runFlow: ../../assertions/home-ready.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: home-menu
      - tapOn: "Settings"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: home-settings
- scrollUntilVisible:
    element:
      id: settings-storage
    direction: DOWN
    timeout: 20000
