# Pre: home ready. Post: settings storage row visible. Does not change settings.
appId: ${APP_ID}
---
- runFlow: ../../assertions/home-ready.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      # iOS top-level destinations are native tabs; a tap can be lost while a system prompt closes.
      - retry:
          maxRetries: 3
          commands:
            - runFlow: ../system/dismiss-paste-prompt.yaml
            - tapOn: "Settings"
            - extendedWaitUntil:
                visible:
                  id: settings-storage
                timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: main-tab-Preferences
- scrollUntilVisible:
    element:
      id: settings-storage
    direction: DOWN
    timeout: 20000
