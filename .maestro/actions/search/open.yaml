# Pre: home with search closed. Post: the real search input is visible and focused.
# iOS enters search from the native tab bar search button; Android from the home search bar.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: magnifyingglass
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: history-search-open
- assertVisible:
    id: history-search-input
- runFlow:
    when:
      platform: iOS
      visible: "(?s)Speed up your typing.*"
    commands:
      - tapOn: Continue
