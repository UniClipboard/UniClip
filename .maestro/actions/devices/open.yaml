# Pre: main screen visible. Post: sync method page visible.
# Sync method and space devices are the top-level Devices destination on both platforms.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Devices"
      - extendedWaitUntil:
          visible:
            id: sync-channel-picker
          timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: main-tab-Devices
      - extendedWaitUntil:
          visible:
            id: sync-channel-p2p
          timeout: 20000
