# Real UI only; device isolation is owned by e2e/environment.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      # iOS: overflow menu; Android: settings button in the search bar
      id: "home-(menu|settings)"
    timeout: 90000
- assertNotVisible:
    id: settings-storage
- assertNotVisible:
    id: storage-back
