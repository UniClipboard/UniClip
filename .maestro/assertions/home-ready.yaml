# Real UI only; device isolation is owned by e2e/environment.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      # iOS: overflow menu; Android: search bar (settings is a bottom navigation tab)
      id: "home-menu|history-search-open"
    timeout: 90000
- assertNotVisible:
    id: settings-storage
- assertNotVisible:
    id: storage-back
