appId: ${APP_ID}
---
# Android Compose keeps the button label in a child node of the identified button.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: ".*Stop detailed recording.*"
          childOf:
            id: engine-diagnostic-capture
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: engine-diagnostic-capture
          text: ".*Stop detailed recording.*"
