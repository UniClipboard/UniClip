# Pre: the app was opened by a share intent and shows the share sheet with the LAN servers.
# Post: the shared item was sent to every selected server and the sheet reports it.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "Send to servers"
    timeout: 20000
- extendedWaitUntil:
    visible: "Send"
    timeout: 20000
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Sent"
    timeout: 60000
- tapOn: "Sent"
