name: ios-build-check

on:
  workflow_call:

env:
  APP_VARIANT: production

jobs:
  build:
    name: Build iOS app and extensions
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode 26
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply project dependency patches
        run: npm run postinstall

      - name: Build project modules without secrets
        run: npm run prepare --workspaces --if-present

      - name: Detect Engine pin mode
        id: engine
        run: echo "source=$(node -p "require('./modules/uc-engine/core-source.json').artifactSource || 'release'")" >> "$GITHUB_OUTPUT"

      # Commit pins compile Engine from source; keep the cargo target between runs.
      - name: Restore Engine build cache
        if: steps.engine.outputs.source == 'commit'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/engine-target
          key: engine-target-${{ runner.os }}-ios-${{ hashFiles('modules/uc-engine/core-source.json') }}
          restore-keys: engine-target-${{ runner.os }}-ios-

      - name: Prepare unified engine core
        env:
          UC_ENGINE_LOCAL_TARGET_DIR: ${{ steps.engine.outputs.source == 'commit' && format('{0}/engine-target', runner.temp) || '' }}
        run: npm run core:prepare -- --platform ios

      - name: Verify unified engine core
        run: npm run core:verify -- --platform ios

      - name: Expo prebuild
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.UC_POSTHOG_PROJECT_KEY }}
        run: npx expo prebuild -p ios --clean --no-install

      - name: CocoaPods install
        run: cd ios && pod install

      - name: Build app and extensions without signing
        run: |
          xcodebuild build \
            -workspace ios/UniClip.xcworkspace \
            -scheme UniClip \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
