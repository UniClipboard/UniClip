name: android-build

on:
  workflow_call:
    outputs:
      version:
        description: 'App version from package.json'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      POSTHOG_PROJECT_KEY: ${{ secrets.UC_POSTHOG_PROJECT_KEY }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Prepare unified engine core
        run: npm run core:prepare

      - name: Verify unified engine core
        run: npm run core:verify

      - name: Expo prebuild
        run: npx expo prebuild -p android --no-install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          VERSION=${{ steps.version.outputs.version }}
          mv app-arm64-v8a-release.apk "UniClip-${VERSION}-arm64-v8a.apk"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-v8a
          path: android/app/build/outputs/apk/release/UniClip-${{ steps.version.outputs.version }}-arm64-v8a.apk
          if-no-files-found: error
