name: test

on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Test issue lifecycle with mocked GitHub APIs
        run: node --test scripts/tests/issue-lifecycle.test.mjs

      - name: Test CI change classification and required checks
        run: node --test scripts/tests/ci-changes.test.mjs scripts/tests/ci-workflows.test.mjs scripts/tests/ci-native-recipes.test.mjs

      - name: Test snapshot-only Engine cache consumption
        run: |
          python3 scripts/__tests__/engine-cache-snapshot.test.py
          python3 scripts/__tests__/engine-cache-native.test.py
          tools=$(bash scripts/engine-cache-tools.sh)
          python3 "$tools/scripts/build-cache/mbx-snapshot.test.py"
          node --test scripts/__tests__/engine-build-environment.test.mjs

      - name: Run CI tests
        run: npm run test:ci

      - name: Validate E2E structure and device lifecycle
        run: npm run test:e2e:environment
